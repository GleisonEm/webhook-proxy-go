apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-proxy
  labels:
    app: webhook-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-proxy
  template:
    metadata:
      labels:
        app: webhook-proxy
    spec:
      containers:
        - name: app
          image: gleisonem/webhook-proxy-go:latest # Replace with your dockerhub username if different
          imagePullPolicy: Always
          ports:
            - containerPort: 8095
              name: http
          env:
            - name: APP_SERVER_PORT
              value: "8095"
            - name: APP_NATS_URL
              value: "nats://nats:4222" # Connecting to the NATS service
            - name: APP_NATS_MAX_RETRIES
              value: "5"
            - name: APP_LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-proxy
spec:
  ports:
    - port: 80
      targetPort: 8095
      name: http
  selector:
    app: webhook-proxy
