apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-proxy
  labels:
    app: webhook-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webhook-proxy
  template:
    metadata:
      labels:
        app: webhook-proxy
    spec:
      containers:
        - name: app
          image: gemanueldev/webhook-proxy-go:latest # Replace with your dockerhub username if different
          imagePullPolicy: Always
          ports:
            - containerPort: 8095
              name: http
          envFrom:
            - secretRef:
                name: webhook-proxy-env
          # Variáveis que não são sensíveis ou padrão podem ficar aqui,
          # mas se estiverem na Secret, a Secret tem prioridade se montada de outra forma,
          # mas envFrom mescla tudo. Vamos preferir tudo na Secret para centralizar.
          env:
            - name: APP_SERVER_PORT
              value: "8095" # Porta interna do container precisa bater com a livenessProbe
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-proxy
spec:
  ports:
    - port: 80
      targetPort: 8095
      name: http
  selector:
    app: webhook-proxy
