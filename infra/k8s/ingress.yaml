apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - webhook-proxy-prod.heyboy.com.br
      secretName: webhook-proxy-prod-tls
  rules:
    # Substitua pelo seu domínio real (ex: api.seudominio.com)
    - host: webhook-proxy-prod.heyboy.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhook-proxy
                port:
                  number: 80
